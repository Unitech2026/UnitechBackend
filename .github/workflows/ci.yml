name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend - Python
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: unitech_test
          POSTGRES_PASSWORD: unitech_test
          POSTGRES_DB: unitech_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U unitech_test -d unitech_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Credenciales ficticias para el servicio temporal de este job.
      TEST_DATABASE_URL: postgresql+psycopg://unitech_test:unitech_test@localhost:5432/unitech_test

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --locked

      - name: Run Ruff
        run: uv run ruff check .

      - name: Check Python syntax
        run: uv run python -m compileall -q main.py database.py migrations

      - name: Check Alembic revisions
        run: uv run alembic heads

      - name: Test migrations and students API
        run: uv run python -m unittest discover -s tests -v

  frontend:
    name: Frontend - React
    runs-on: ubuntu-latest

    env:
      # El build de CI no se publica; solo necesita una URL válida de ejemplo.
      VITE_API_URL: http://127.0.0.1:8000

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Build frontend
        run: npm run build
